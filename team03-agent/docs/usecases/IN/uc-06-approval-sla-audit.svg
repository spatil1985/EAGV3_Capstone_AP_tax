3.3333333333333" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="319" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On request, e.g. &#x27;approval compliance for</text><text x="457.3333333333333" y="343" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Q2&#x27;</text><circle cx="445.3333333333333" cy="365" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="369" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Weekly schedule</text><circle cx="445.3333333333333" cy="391" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="395" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Requests submitted in the window</text><rect x="798.6666666666666" y="251" width="361.3333333333333" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="251" width="5" height="180" rx="2" fill="#2f3c9e"/><circle cx="830.6666666666666" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="830.6666666666666" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="309" width="152.4" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">ApprovalRequest.list</text><rect x="979.0666666666666" y="309" width="125.52000000000001" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="988.0666666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">ApprovalLog.list</text><rect x="820.6666666666666" y="339" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="355.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">check_sla</text><circle cx="824.6666666666666" cy="383" r="3.5" fill="#57606a"/><text x="836.6666666666666" y="387" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">ApprovalPolicy.list returns 403, so SLA rules</text><text x="836.6666666666666" y="405" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">come from each request.</text><text x="40" y="461" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="457" x2="1160" y2="457" stroke="#d0d7de"/><rect x="40.0" y="477" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="503" r="14" fill="#2f3c9e"/><text x="66.0" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="541" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Resolved requests</text><text x="54.0" y="563" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Approved, rejected, recalled or cancelled</text><path d="M397.3333333333333 538.0 L417.3333333333333 538.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 532.0 L421.3333333333333 538.0 L413.3333333333333 544.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="477" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="503" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="437.3333333333333" y="541" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Late?</text><text x="437.3333333333333" y="563" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">resolved_at &gt; sla_deadline; compare to</text><text x="437.3333333333333" y="583" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">stored is_overdue</text><path d="M780.6666666666666 538.0 L800.6666666666666 538.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 532.0 L804.6666666666666 538.0 L796.6666666666666 544.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="477" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="503" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="820.6666666666666" y="541" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Sanity gate</text><text x="820.6666666666666" y="563" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">resolved_at in the future → data_quality</text><rect x="40.0" y="615" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="641" r="14" fill="#2f3c9e"/><text x="66.0" y="646" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="54.0" y="679" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Open requests</text><text x="54.0" y="701" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">check_sla dry run is the truth</text><path d="M397.3333333333333 666.0 L417.3333333333333 666.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 660.0 L421.3333333333333 666.0 L413.3333333333333 672.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="615" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="641" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="646" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="437.3333333333333" y="679" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Self-approval</text><text x="437.3333333333333" y="701" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Approver = submitter on any approved log</text><path d="M780.6666666666666 666.0 L800.6666666666666 666.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 660.0 L804.6666666666666 666.0 L796.6666666666666 672.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="615" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="641" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="646" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="820.6666666666666" y="679" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Approved docs</text><text x="820.6666666666666" y="701" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Every approved bill has an approval log</text><rect x="40" y="743" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="743" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="72" cy="773" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="778" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="778" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="802" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="811" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">sla_breach: recomputed lateness vs stored flag</text><rect x="62" y="828" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="837" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">self-approval (segregation of duties)</text><rect x="62" y="854" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="863" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">data_quality: impossible timestamps</text><rect x="609.0" y="743" width="551.0" height="170" rx="10" fill="#e8f5ec" stroke="none" stroke-width="1"/><text x="631.0" y="778" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 28 SEP 2026</text><text x="631.0" y="837" font-size="40" fill="#1a7f37" font-weight="bold" text-anchor="start">5 / 19</text><text x="631.0" y="863" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Resolved requests still flagged wrong after re-stamping; 3 of 55 open</text><text x="631.0" y="883" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">ones wrong. ApprovalPolicy still 403.</text><rect x="40" y="931" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="955" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Cannot read policy thresholds; never approves, rejects or edits a request.</text><line x1="40" y1="988" x2="1160" y2="988" stroke="#d0d7de"/><text x="40" y="1012" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="1012" font-size="12" fill="#57606a" font-weight="normal" text-anchor="end">Spec: IN/uc-06-approval-sla-audit.md</text></svg>
