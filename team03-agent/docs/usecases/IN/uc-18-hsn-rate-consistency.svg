st</text><rect x="1009.7866666666666" y="309" width="91.92" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="1018.7866666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">tax/compute</text><text x="40" y="491" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="487" x2="1160" y2="487" stroke="#d0d7de"/><rect x="40.0" y="507" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="533" r="14" fill="#2f3c9e"/><text x="66.0" y="538" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="571" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Rule 0</text><text x="54.0" y="593" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Exclude invalid lines</text><path d="M397.3333333333333 558.0 L417.3333333333333 558.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 552.0 L421.3333333333333 558.0 L413.3333333333333 564.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="507" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="533" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="538" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="437.3333333333333" y="571" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Effective rate</text><text x="437.3333333333333" y="593" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">(CGST+SGST+IGST) ÷ taxable</text><path d="M780.6666666666666 558.0 L800.6666666666666 558.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 552.0 L804.6666666666666 558.0 L796.6666666666666 564.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="507" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="533" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="538" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="820.6666666666666" y="571" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Consistency</text><text x="820.6666666666666" y="593" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Same HSN, different rates</text><rect x="40.0" y="625" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="651" r="14" fill="#2f3c9e"/><text x="66.0" y="656" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="54.0" y="689" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Master drift</text><text x="54.0" y="711" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Line rate ≠ item master rate</text><path d="M397.3333333333333 676.0 L417.3333333333333 676.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 670.0 L421.3333333333333 676.0 L413.3333333333333 682.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="625" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="651" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="656" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="437.3333333333333" y="689" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Slab validity</text><text x="437.3333333333333" y="711" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Rate outside the slab set</text><path d="M780.6666666666666 676.0 L800.6666666666666 676.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 670.0 L804.6666666666666 676.0 L796.6666666666666 682.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="625" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="651" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="656" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="820.6666666666666" y="689" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Authoritative</text><text x="820.6666666666666" y="711" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">HSN → rate table, when one exists</text><rect x="40" y="753" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="753" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="72" cy="783" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="788" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="788" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="812" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="821" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">hsn_rate_inconsistent</text><rect x="62" y="838" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="847" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">rate_drift_from_master</text><rect x="62" y="864" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="873" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">rate_not_a_slab / rate_wrong_for_hsn</text><rect x="609.0" y="753" width="551.0" height="170" rx="10" fill="#e8f5ec" stroke="none" stroke-width="1"/><text x="631.0" y="788" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 28 SEP 2026</text><text x="631.0" y="847" font-size="40" fill="#1a7f37" font-weight="bold" text-anchor="start">5 HSNs</text><text x="631.0" y="873" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Charged at 2–5 different rates; HSN 73269099 at 0/5/9/12/18%. The tax</text><text x="631.0" y="893" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">oracle has no HSN input.</text><rect x="40" y="941" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="965" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Consistency, not correctness, until an HSN rate table exists.</text><line x1="40" y1="998" x2="1160" y2="998" stroke="#d0d7de"/><text x="40" y="1022" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="1022" font-size="12" fill="#57606a" font-weight="normal" text-anchor="end">Spec: IN/uc-18-hsn-rate-consistency.md</text></svg>
