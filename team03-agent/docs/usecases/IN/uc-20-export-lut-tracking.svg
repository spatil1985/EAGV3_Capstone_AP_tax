<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">UC-20 — Export of services and LUT tracking</title><desc id="d">Are our export invoices genuinely zero-rated, and is our LUT still valid?</desc><rect width="1200" height="920" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="106" fill="#2f3c9e"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">UC-20  ·  INDIA · GST</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Export of services and LUT tracking</text><rect x="930" y="22" width="230" height="62" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#9a6700" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PARTIAL</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Partial · LUT validity not stored</text><circle cx="948" cy="45" r="6" fill="#9a6700"/><rect x="40" y="124" width="87.2" height="24" rx="12" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="83.6" y="140.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="middle">Output tax</text><rect x="135.2" y="124" width="120.80000000000001" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="195.6" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: agency</text><rect x="264.0" y="124" width="154.4" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="341.2" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: export-lut</text><rect x="40" y="166" width="1120" height="63" rx="14" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="66" y="212" font-size="38" fill="#2f3c9e" font-weight="bold" text-anchor="start">?</text><text x="110" y="203" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“Are our export invoices genuinely zero-rated, and is our LUT still valid?”</text><rect x="40.0" y="251" width="361.3333333333333" height="190" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="251" width="5" height="190" rx="2" fill="#2f3c9e"/><circle cx="72.0" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72.0" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="319" r="3.5" fill="#2f3c9e"/><text x="78.0" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">IGST s.16(1): exports and SEZ supplies are</text><text x="78.0" y="343" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">zero-rated</text><circle cx="66.0" cy="365" r="3.5" fill="#2f3c9e"/><text x="78.0" y="369" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">s.16(3) + Rule 96A: under LUT, no tax paid</text><circle cx="66.0" cy="391" r="3.5" fill="#2f3c9e"/><text x="78.0" y="395" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">IGST s.2(6): five conditions for export of</text><text x="78.0" y="415" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">services</text><rect x="419.3333333333333" y="251" width="361.3333333333333" height="190" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="419.3333333333333" y="251" width="5" height="190" rx="2" fill="#2f3c9e"/><circle cx="451.3333333333333" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="451.3333333333333" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="319" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On every overseas / SEZ invoice</text><circle cx="445.3333333333333" cy="345" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="349" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Annually on 1 April: LUTs lapse</text><circle cx="445.3333333333333" cy="371" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="375" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Invoice date vs LUT FY</text><rect x="798.6666666666666" y="251" width="361.3333333333333" height="190" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="251" width="5" height="190" rx="2" fill="#2f3c9e"/><circle cx="830.6666666666666" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="830.6666666666666" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="309" width="98.64000000000001" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Invoice.list</text><rect x="925.3066666666666" y="309" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="934.3066666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Party.get</text><rect x="1009.7866666666666" y="309" width="132.24" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="1018.7866666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">TaxExemption.list</text><text x="40" y="471" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="467" x2="1160" y2="467" stroke="#d0d7de"/><rect x="40.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="513" r="14" fill="#2f3c9e"/><text x="66.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">SEZ</text><text x="54.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">No CGST/SGST; LUT or IGST</text><text x="54.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">paid</text><path d="M244.0 546.0 L264.0 546.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M260.0 540.0 L268.0 546.0 L260.0 552.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="270.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="296.0" cy="513" r="14" fill="#2f3c9e"/><text x="296.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="284.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Export of services</text><text x="284.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">All five s.2(6)</text><text x="284.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">conditions</text><path d="M474.0 546.0 L494.0 546.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M490.0 540.0 L498.0 546.0 L490.0 552.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="500.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="526.0" cy="513" r="14" fill="#2f3c9e"/><text x="526.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="514.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Deemed export</text><text x="514.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Not zero-rated</text><path d="M704.0 546.0 L724.0 546.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M720.0 540.0 L728.0 546.0 L720.0 552.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="730.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="756.0" cy="513" r="14" fill="#2f3c9e"/><text x="756.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="744.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Find LUT</text><text x="744.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">TaxExemption row matching</text><text x="744.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">LUT</text><path d="M934.0 546.0 L954.0 546.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M950.0 540.0 L958.0 546.0 L950.0 552.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="960.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="986.0" cy="513" r="14" fill="#2f3c9e"/><text x="986.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="974.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Validity</text><text x="974.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Playbook ARN and FY until</text><text x="974.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">GAP-5 closes</text><rect x="40" y="631" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="631" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="72" cy="661" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="666" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="666" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="690" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="699" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">lut_missing / lut_expired / lut_validity_unknown</text><rect x="62" y="716" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="725" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">export_condition_failed</text><rect x="62" y="742" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="751" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">sez_intra_state_tax_charged</text><rect x="609.0" y="631" width="551.0" height="170" rx="10" fill="#fff4d6" stroke="none" stroke-width="1"/><text x="631.0" y="666" font-size="13" fill="#9a6700" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 28 SEP 2026</text><text x="631.0" y="725" font-size="40" fill="#9a6700" font-weight="bold" text-anchor="start">15 invoices</text><text x="631.0" y="751" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Zero-tax SEZ invoices. An LUT row exists but has no validity dates and</text><text x="631.0" y="771" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">no party link.</text><rect x="40" y="819" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="843" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Owns the place-of-supply contract used by UC-03 and UC-21.</text><line x1="40" y1="876" x2="1160" y2="876" stroke="#d0d7de"/><text x="40" y="900" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="900" font-size="12" fill="#57606a" font-weight="norm