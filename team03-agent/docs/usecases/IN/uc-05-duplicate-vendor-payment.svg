iddle">⏱</text><text x="473.3333333333333" y="302" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="335" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="339" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On every new bill, before approval</text><circle cx="445.3333333333333" cy="361" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="365" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Daily sweep over open bills</text><circle cx="445.3333333333333" cy="387" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="391" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Current financial year</text><rect x="798.6666666666666" y="267" width="361.3333333333333" height="164" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="267" width="5" height="164" rx="2" fill="#2f3c9e"/><circle cx="830.6666666666666" cy="297" r="14" fill="#2f3c9e" opacity="0.12"/><text x="830.6666666666666" y="302" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="302" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="325" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="341.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Bill.list</text><rect x="905.1466666666666" y="325" width="85.2" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="914.1466666666666" y="341.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">bill_match</text><rect x="996.3466666666667" y="325" width="125.52000000000001" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="1005.3466666666667" y="341.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">PaymentMade.list</text><rect x="820.6666666666666" y="355" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="371.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Party.get</text><text x="40" y="461" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="457" x2="1160" y2="457" stroke="#d0d7de"/><rect x="40.0" y="477" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="503" r="14" fill="#2f3c9e"/><text x="66.0" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="541" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Tier 1: exact</text><text x="54.0" y="563" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Same vendor + supplier bill number</text><path d="M397.3333333333333 528.0 L417.3333333333333 528.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 522.0 L421.3333333333333 528.0 L413.3333333333333 534.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="477" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="503" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="437.3333333333333" y="541" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Tier 2: over-billed</text><text x="437.3333333333333" y="563" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">bill_match on PO bills</text><path d="M780.6666666666666 528.0 L800.6666666666666 528.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 522.0 L804.6666666666666 528.0 L796.6666666666666 534.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="477" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="503" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="820.6666666666666" y="541" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Tier 3: amount</text><text x="820.6666666666666" y="563" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Same vendor, same total, close dates</text><rect x="40.0" y="595" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="621" r="14" fill="#2f3c9e"/><text x="66.0" y="626" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="54.0" y="659" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Recurring gate</text><text x="54.0" y="681" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Drop pairs from one recurring template</text><path d="M397.3333333333333 646.0 L417.3333333333333 646.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 640.0 L421.3333333333333 646.0 L413.3333333333333 652.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="595" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="621" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="626" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="437.3333333333333" y="659" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Strengthen / weaken</text><text x="437.3333333333333" y="681" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Lines, PO, dates adjust confidence</text><path d="M780.6666666666666 646.0 L800.6666666666666 646.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 640.0 L804.6666666666666 646.0 L796.6666666666666 652.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="595" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="621" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="626" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="820.6666666666666" y="659" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Paid check</text><text x="820.6666666666666" y="681" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Both paid → recovery; one paid → hold</text><rect x="40" y="723" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="723" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="72" cy="753" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="758" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="758" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="782" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="791" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">duplicate_payment · suspicious_strong / suspicious_weak</text><rect x="62" y="808" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="817" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">over_billed (Tier 2, via bill_match)</text><rect x="62" y="834" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="843" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">data_quality: recurring scheduler defects</text><rect x="609.0" y="723" width="551.0" height="170" rx="10" fill="#fff4d6" stroke="none" stroke-width="1"/><text x="631.0" y="758" font-size="13" fill="#9a6700" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 28 SEP 2026</text><text x="631.0" y="817" font-size="40" fill="#9a6700" font-weight="bold" text-anchor="start">10 pairs</text><text x="631.0" y="843" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">218 amount pairs; 208 suppressed by the recurring gate. Exact tier</text><text x="631.0" y="863" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">usable on only 18 of 227 bills.</text><rect x="40" y="911" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="935" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Recommends holds; cannot hold or void a bill (Bill.hold is a requested tool).</text><line x1="40" y1="968" x2="1160" y2="968" stroke="#d0d7de"/><text x="40" y="992" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="992" font-size="12" fill="#57606a" font-weight="normal" text-anchor="end">Spec: IN/uc-05-duplicate-vendor-payment.md</text></svg>
