<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1012" viewBox="0 0 1200 1012" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">UC-05 — Duplicate vendor payment detection</title><desc id="d">Is any vendor being paid twice?</desc><rect width="1200" height="1012" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="122" fill="#2f3c9e"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">UC-05  ·  INDIA · GST</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Duplicate vendor payment detection</text><rect x="930" y="22" width="230" height="78" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#9a6700" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PARTIAL</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Rework required · exact key</text><text x="1045.0" y="86" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">usable on 8% of bills</text><circle cx="948" cy="45" r="6" fill="#9a6700"/><rect x="40" y="140" width="127.52000000000001" height="24" rx="12" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="103.76" y="156.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="middle">Payables control</text><rect x="175.52" y="140" width="134.24" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="242.64000000000001" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: all five</text><rect x="317.76" y="140" width="154.4" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="394.96" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: duplicates</text><rect x="480.15999999999997" y="140" width="93.92" height="24" rx="12" fill="#f0f2f4" s