09" width="132.24" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="1018.7866666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">TaxExemption.list</text><text x="40" y="471" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="467" x2="1160" y2="467" stroke="#d0d7de"/><rect x="40.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="513" r="14" fill="#2f3c9e"/><text x="66.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Stage 1: master</text><text x="54.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">As UC-07, plus clinic</text><text x="54.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">stream table</text><path d="M244.0 546.0 L264.0 546.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M260.0 540.0 L268.0 546.0 L260.0 552.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="270.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="296.0" cy="513" r="14" fill="#2f3c9e"/><text x="296.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="284.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Stage 2: lines</text><text x="284.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Classify each invoice</text><text x="284.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">line</text><path d="M474.0 546.0 L494.0 546.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M490.0 540.0 L498.0 546.0 L490.0 552.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="500.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="526.0" cy="513" r="14" fill="#2f3c9e"/><text x="526.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="514.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Room-rent test</text><text x="514.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Ward &gt; ₹5,000/day →</text><text x="514.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">exactly 5%</text><path d="M704.0 546.0 L724.0 546.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M720.0 540.0 L728.0 546.0 L720.0 552.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="730.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="756.0" cy="513" r="14" fill="#2f3c9e"/><text x="756.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="744.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Pharmacy split</text><text x="744.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Default: every pharmacy</text><text x="744.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">line OP, taxable</text><path d="M934.0 546.0 L954.0 546.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M950.0 540.0 L958.0 546.0 L950.0 552.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="960.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="986.0" cy="513" r="14" fill="#2f3c9e"/><text x="986.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="974.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Aggregate</text><text x="974.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">E, T, F for UC-15</text><rect x="40" y="631" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="631" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="72" cy="661" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="666" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="666" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="690" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="699" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">exempt_but_taxed</text><rect x="62" y="716" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="725" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">room_rent_threshold: ward &gt; ₹5,000/day</text><rect x="62" y="742" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="751" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">ip_op_unknown</text><rect x="62" y="768" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="777" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">turnover_split for UC-15</text><rect x="609.0" y="631" width="551.0" height="170" rx="10" fill="#fff4d6" stroke="none" stroke-width="1"/><text x="631.0" y="666" font-size="13" fill="#9a6700" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 28 SEP 2026</text><text x="631.0" y="725" font-size="40" fill="#9a6700" font-weight="bold" text-anchor="start">Engine shared</text><text x="631.0" y="751" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">No clinic tenant. Shares UC-07&#x27;s engine; the room-rent rule is</text><text x="631.0" y="771" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">playbook-only.</text><rect x="40" y="819" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="843" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: No patient-type field, so IP/OP pharmacy is a conservative default.</text><line x1="40" y1="876" x2="1160" y2="876" stroke="#d0d7de"/><text x="40" y="900" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="900" font-size="12" fill="#57606a" font-weight="normal" text-anchor="end">Spec: IN/uc-14-clinic-exempt-taxable-split.md</text></svg>
