<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="929" viewBox="0 0 1200 929" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">UC-36 — Retail: e-commerce TCS (s.52) and s.9(5)</title><desc id="d">Do our marketplace sales, and the tax the marketplace collected on them, agree with what we report — and have we claimed that collected tax back?</desc><rect width="1200" height="929" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="106" fill="#2f3c9e"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">UC-36  ·  INDIA · GST</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Retail: e-commerce TCS (s.52) and s.9(5)</text><rect x="930" y="22" width="230" height="62" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#b42318" font-weight="bold" text-anchor="middle" letter-spacing="1.5">BLOCKED</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Blocked (F22) · no sales channel</text><circle cx="948" cy="45" r="6" fill="#b42318"/><rect x="40" y="124" width="87.2" height="24" rx="12" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="83.6" y="140.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="middle">Output tax</text><rect x="135.2" y="124" width="120.80000000000001" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="195.6" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: retail</text><rect x="264.0" y="124" width="161.12" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="344.56" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: marketplace</text><rect x="433.12" y="124" width="93.92" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><t