" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="451.3333333333333" cy="310" r="14" fill="#2f3c9e" opacity="0.12"/><text x="451.3333333333333" y="315" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="315" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="348" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="352" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Monthly after the 10th (GSTR-8 available)</text><circle cx="445.3333333333333" cy="374" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="378" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On request</text><rect x="798.6666666666666" y="280" width="361.3333333333333" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="280" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="830.6666666666666" cy="310" r="14" fill="#2f3c9e" opacity="0.12"/><text x="830.6666666666666" y="315" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="315" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="338" width="239.76000000000002" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="354.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Invoice.sales_channel (requested)</text><circle cx="824.6666666666666" cy="382" r="3.5" fill="#57606a"/><text x="836.6666666666666" y="386" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">No sales-channel field and no TCS-credit</text><text x="836.6666666666666" y="404" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">record.</text><text x="40" y="480" font-size="13" fill="#2f3c9e" font