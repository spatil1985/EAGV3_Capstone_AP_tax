<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">UC-44 — Approval threshold splitting</title><desc id="d">Is anyone splitting purchases into smaller bills so each one stays under the approval limit?</desc><rect width="1200" height="890" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="106" fill="#2f3c9e"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">UC-44  ·  INDIA · GST</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Approval threshold splitting</text><rect x="930" y="22" width="230" height="62" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#9a6700" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PARTIAL</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Partial · threshold not readable</text><circle cx="948" cy="45" r="6" fill="#9a6700"/><rect x="40" y="124" width="127.52000000000001" height="24" rx="12" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="103.76" y="140.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="middle">Payables control</text><rect x="175.52" y="124" width="134.24" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="242.64000000000001" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: all five</text><rect x="317.76" y="124" width="188.00000000000003" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="411.76" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: threshold-split</text><rect x="513.76" y="124" width="93.92" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="560.72" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Twin: US-20</text><rect x="40" y="166" width="1120" height="63" rx="14" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="66" y="212" font-size="38" fill="#2f3c9e" font-weight="bold" text-anchor="start">?</text><text x="110" y="203" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“Is anyone splitting purchases into smaller bills so each one stays under the approval limit?”</text><rect x="40.0" y="251" width="361.3333333333333" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="251" width="5" height="180" rx="2" fill="#2f3c9e"/><circle cx="72.0" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72.0" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="319" r="3.5" fill="#2f3c9e"/><text x="78.0" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Control, not tax statute</text><circle cx="66.0" cy="345" r="3.5" fill="#2f3c9e"/><text x="78.0" y="349" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Splits can also dodge e-way bill and TDS</text><text x="78.0" y="369" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">thresholds</text><rect x="419.3333333333333" y="251" width="361.3333333333333" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="419.3333333333333" y="251" width="5" height="180" rx="2" fill="#2f3c9e"/><circle cx="451.3333333333333" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="451.3333333333333" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="319" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On bill created with recent same-vendor</text><text x="457.3333333333333" y="343" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">bill</text><circle cx="445.3333333333333" cy="365" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="369" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Weekly sweep</text><circle cx="445.3333333333333" cy="391" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="395" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On request</text><rect x="798.6666666666666" y="251" width="361.3333333333333" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="251" width="5" height="180" rx="2" fill="#2f3c9e"/><circle cx="830.6666666666666" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="830.6666666666666" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="309" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Bill.list</text><rect x="905.1466666666666" y="309" width="138.96" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="914.1466666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">PurchaseOrder.list</text><rect x="820.6666666666666" y="339" width="152.4" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="355.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">ApprovalRequest.list</text><circle cx="824.6666666666666" cy="383" r="3.5" fill="#57606a"/><text x="836.6666666666666" y="387" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">ApprovalPolicy returns 403: threshold from</text><text x="836.6666666666666" y="405" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">config or inferred.</text><text x="40" y="461" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="457" x2="1160" y2="457" stroke="#d0d7de"/><rect x="40.0" y="477" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="503" r="14" fill="#2f3c9e"/><text x="66.0" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="541" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Threshold</text><text x="54.0" y="563" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Config, else inferred</text><path d="M244.0 536.0 L264.0 536.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M260.0 530.0 L268.0 536.0 L260.0 542.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="270.0" y="477" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="296.0" cy="503" r="14" fill="#2f3c9e"/><text x="296.0" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="284.0" y="541" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Window groups</text><text x="284.0" y="563" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Same vendor within W days</text><path d="M474.0 536.0 L494.0 536.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M490.0 530.0 L498.0 536.0 L490.0 542.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="500.0" y="477" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="526.0" cy="503" r="14" fill="#2f3c9e"/><text x="526.0" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="514.0" y="541" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Split candidate</text><text x="514.0" y="563" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Each below, sum above</text><path d="M704.0 536.0 L724.0 536.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M720.0 530.0 L728.0 536.0 L720.0 542.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="730.0" y="477" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="756.0" cy="503" r="14" fill="#2f3c9e"/><text x="756.0" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="744.0" y="541" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Exclusions</text><text x="744.0" y="563" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Standing orders,</text><text x="744.0" y="581" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">recurring</text><path d="M934.0 536.0 L954.0 536.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M950.0 530.0 L958.0 536.0 L950.0 542.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="960.0" y="477" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="986.0" cy="503" r="14" fill="#2f3c9e"/><text x="986.0" y="508" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="974.0" y="541" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Context</text><text x="974.0" y="563" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">policy_unreadable row</text><rect x="40" y="621" width="551.0" height="150" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="621" width="5" height="150" rx="2" fill="#2f3c9e"/><circle cx="72" cy="651" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="656" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="656" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="680" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="689" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">split_candidate</text><rect x="62" y="706" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="715" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">policy_unreadable</text><rect x="609.0" y="621" width="551.0" height="150" rx="10" fill="#fff4d6" stroke="none" stroke-width="1"/><text x="631.0" y="656" font-size="13" fill="#9a6700" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 4 OCT 2026</text><text x="631.0" y="715" font-size="40" fill="#9a6700" font-weight="bold" text-anchor="start">2 groups</text><text x="631.0" y="741" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Candidates at an assumed ₹1 lakh threshold. ApprovalPolicy 403.</text><rect x="40" y="789" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="813" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Companion to UC-06.</text><line x1="40" y1="846" x2="1160" y2="846" stroke="#d0d7de"/><text x="40" y="870" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="870" font-size="12" fill="#57606a" font-weight="normal" text-anchor="end">Spec: IN/uc-44-approval-threshold-splitting.md</text></svg>
