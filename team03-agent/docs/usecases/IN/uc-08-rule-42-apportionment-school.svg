 font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Item.list</text><rect x="989.6266666666667" y="325" width="98.64000000000001" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="998.6266666666667" y="341.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">UC-07 output</text><text x="40" y="487" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="483" x2="1160" y2="483" stroke="#d0d7de"/><rect x="40.0" y="503" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="529" r="14" fill="#2f3c9e"/><text x="66.0" y="534" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="567" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Total credit T</text><text x="54.0" y="589" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Validated tax on eligible bills</text><path d="M397.3333333333333 554.0 L417.3333333333333 554.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 548.0 L421.3333333333333 554.0 L413.3333333333333 560.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="503" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="529" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="534" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="437.3333333333333" y="567" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Remove T1–T4</text><text x="437.3333333333333" y="589" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Exclusive-use, blocked, exempt-only credit</text><path d="M780.6666666666666 554.0 L800.6666666666666 554.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.66666666666