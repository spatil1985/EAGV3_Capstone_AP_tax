ook: apportionment</text><rect x="439.84000000000003" y="140" width="93.92" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="486.8" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Twin: UC-15</text><rect x="40" y="182" width="1120" height="63" rx="14" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="66" y="228" font-size="38" fill="#2f3c9e" font-weight="bold" text-anchor="start">?</text><text x="110" y="219" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“How much of our input credit are we actually entitled to keep?”</text><rect x="40.0" y="267" width="361.3333333333333" height="190" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="267" width="5" height="190" rx="2" fill="#2f3c9e"/><circle cx="72.0" cy="297" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72.0" y="302" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="302" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="335" r="3.5" fill="#2f3c9e"/><text x="78.0" y="339" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">s.17(1)–(2): credit only for taxable</text><text x="78.0" y="359" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">supplies</text><circle cx="66.0" cy="381" r="3.5" fill="#2f3c9e"/><text x="78.0" y="385" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Rule 42: monthly reversal of common credit</text><text x="78.0" y="405" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">D1 = C2 × E ÷ F</text><circle cx="66.0" cy="427" r="3.5" fill="#2f3c9e"/><text x="78.0" y="431" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Annual true-up under Rule 42(2)</text><rect x="419.3333333333333" y="267" width="361.3333333333333" height="190" rx="10" fill="#ff