rge, supplier tax</text><path d="M876.5 528.0 L896.5 528.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M892.5 522.0 L900.5 528.0 L892.5 534.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="902.5" y="467" width="257.5" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="928.5" cy="493" r="14" fill="#2f3c9e"/><text x="928.5" y="498" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="916.5" y="531" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Emit</text><text x="916.5" y="553" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">UC-03 row shape</text><rect x="40" y="615" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="615" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="72" cy="645" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="650" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="650" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="674" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="683" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">rcm_import_undeclared</text><rect x="62" y="700" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="709" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">rcm_double_tax</text><rect x="62" y="726" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="735" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">classification_conflict</text><rect x="609.0" y="615" width="551.0" height="170" rx="10" fill="#fff4d6" stroke="none" stroke-width="1"/><text x="631.0" y="650" font-size="13" fill="#9a6700" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 28 SEP 2026</text><text x="631.0" y="709" font-size="40" fill="#9a6700" font-weight="bold" text-anchor="start">12 bills</text><text x="631.0" y="735" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Tagged overseas, all INR from Indian vendors. No genuine overseas</text><text x="631.0" y="755" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">vendor in the data.</text><rect x="40" y="803" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="827" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Goods imports are customs IGST at the border, out of scope.</text><line x1="40" y1="860" x2="1160" y2="860" stroke="#d0d7de"/><text x="40" y="884" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="884" font-size="12" fill="#57606a" font-weight="normal" text-anchor="end">Spec: IN/uc-21-import-of-services-rcm.md</text></svg>
