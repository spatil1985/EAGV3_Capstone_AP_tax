6" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="319" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Monthly turnover run-rate (org as dealer)</text><circle cx="445.3333333333333" cy="345" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="349" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On every bill from a composition vendor</text><rect x="798.6666666666666" y="251" width="361.3333333333333" height="190" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="251" width="5" height="190" rx="2" fill="#2f3c9e"/><circle cx="830.6666666666666" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="830.6666666666666" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="309" width="98.64000000000001" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Invoice.list</text><rect x="925.3066666666666" y="309" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="934.3066666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Bill.list</text><rect x="1009.7866666666666" y="309" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="1018.7866666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Party.get</text><circle cx="824.6666666666666" cy="353" r="3.5" fill="#57606a"/><text x="836.6666666666666" y="357" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Company h