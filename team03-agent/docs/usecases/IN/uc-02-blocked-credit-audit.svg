<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1062" viewBox="0 0 1200 1062" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">UC-02 — Blocked credit audit under s.17(5)</title><desc id="d">Have we claimed credit on anything the law blocks?</desc><rect width="1200" height="1062" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="106" fill="#2f3c9e"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">UC-02  ·  INDIA · GST</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Blocked credit audit under s.17(5)</text><rect x="930" y="22" width="230" height="62" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#1a7f37" font-weight="bold" text-anchor="middle" letter-spacing="1.5">BUILDABLE</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Buildable now</text><circle cx="948" cy="45" r="6" fill="#1a7f37"/><rect x="40" y="124" width="80.48" height="24" rx="12" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="80.24000000000001" y="140.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="middle">Input tax</text><rect x="128.48000000000002" y="124" width="134.24" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="195.60000000000002" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: all five</text><rect x="270.72" y="124" width="181.28000000000003" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="361.36" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: blocked-credit</text><rect x="40" y="166" width="1120" height="63" rx="14" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="66" y="212" font-size="38" fill="#2f3c9e" font-weight="bold" text-anchor="start">?</text><text x="110" y="203" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“Have we claimed credit on anything the law blocks?”</text><rect x="40.0" y="251" width="361.3333333333333" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="251" width="5" height="210" rx="2" fill="#2f3c9e"/><circle cx="72.0" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72.0" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="319" r="3.5" fill="#2f3c9e"/><text x="78.0" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">s.17(5) blocks credit on motor vehicles,</text><text x="78.0" y="343" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">food, club fees, works contracts, personal</text><text x="78.0" y="363" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">use and more</text><circle cx="66.0" cy="385" r="3.5" fill="#2f3c9e"/><text x="78.0" y="389" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Credit wrongly taken must be reversed with</text><text x="78.0" y="409" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">interest</text><circle cx="66.0" cy="431" r="3.5" fill="#2f3c9e"/><text x="78.0" y="435" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Engineering spec, not tax advice</text><rect x="419.3333333333333" y="251" width="361.3333333333333" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="419.3333333333333" y="251" width="5" height="210" rx="2" fill="#2f3c9e"/><circle cx="451.3333333333333" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="451.3333333333333" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="319" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Scheduled periodic sweep over all bills</text><circle cx="445.3333333333333" cy="345" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="349" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On request</text><circle cx="445.3333333333333" cy="371" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="375" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Point-in-time; no period window</text><rect x="798.6666666666666" y="251" width="361.3333333333333" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="251" width="5" height="210" rx="2" fill="#2f3c9e"/><circle cx="830.6666666666666" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="830.6666666666666" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="309" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Bill.list</text><rect x="905.1466666666666" y="309" width="118.80000000000001" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="914.1466666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Item.hsn_or_sac</text><rect x="820.6666666666666" y="339" width="125.52000000000001" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="355.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Item.category_id</text><circle cx="824.6666666666666" cy="383" r="3.5" fill="#57606a"/><text x="836.6666666666666" y="387" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Owns the HSN-prefix → blocked-category table</text><text x="836.6666666666666" y="405" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">that UC-16 reuses.</text><text x="40" y="491" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="487" x2="1160" y2="487" stroke="#d0d7de"/><rect x="40.0" y="507" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="533" r="14" fill="#2f3c9e"/><text x="66.0" y="538" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="571" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Fetch eligible bills</text><text x="54.0" y="593" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">itc_eligibility ≠ ineligible</text><path d="M397.3333333333333 558.0 L417.3333333333333 558.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 552.0 L421.3333333333333 558.0 L413.3333333333333 564.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="507" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="533" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="538" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="437.3333333333333" y="571" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Resolve each line</text><text x="437.3333333333333" y="593" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">HSN/SAC and category from the Item master</text><path d="M780.6666666666666 558.0 L800.6666666666666 558.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 552.0 L804.6666666666666 558.0 L796.6666666666666 564.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="507" width="353.3333333333333" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="533" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="538" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="820.6666666666666" y="571" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Match blocked table</text><text x="820.6666666666666" y="593" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">HSN prefix → s.17(5) category</text><rect x="40.0" y="625" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="651" r="14" fill="#2f3c9e"/><text x="66.0" y="656" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="54.0" y="689" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Apply exceptions</text><text x="54.0" y="711" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">e.g. vehicles used for transport of goods,</text><text x="54.0" y="731" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">where fields allow</text><path d="M397.3333333333333 686.0 L417.3333333333333 686.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 680.0 L421.3333333333333 686.0 L413.3333333333333 692.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="625" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="651" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="656" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="437.3333333333333" y="689" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Credit at risk</text><text x="437.3333333333333" y="711" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Line tax from the validated tax source</text><path d="M780.6666666666666 686.0 L800.6666666666666 686.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 680.0 L804.6666666666666 686.0 L796.6666666666666 692.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="625" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="651" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="656" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="820.6666666666666" y="689" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Emit and total</text><text x="820.6666666666666" y="711" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">One row per line, grouped by bill; sums via</text><text x="820.6666666666666" y="731" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">tax_math.py</text><rect x="40" y="773" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="773" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="72" cy="803" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="808" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="808" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="832" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="841" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">blocked_credit_suspected: line in an s.17(5) category with credit taken</text><rect x="62" y="858" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="867" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">itc_possibly_under_claimed</text><rect x="62" y="884" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="893" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">missing_required_field: no HSN/SAC to classify</text><rect x="609.0" y="773" width="551.0" height="170" rx="10" fill="#e8f5ec" stroke="none" stroke-width="1"/><text x="631.0" y="808" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 28 SEP 2026</text><text x="631.0" y="867" font-size="40" fill="#1a7f37" font-weight="bold" text-anchor="start">0 / 250</text><text x="631.0" y="893" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">No bill line falls in a blocked HSN/SAC. 54 lines (22%) carry no HSN</text><text x="631.0" y="913" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">at all and cannot be classified.</text><rect x="40" y="961" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="985" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Classifies by code, not by use: a car bought for goods transport needs a human check.</text><line x1="40" y1="1018" x2="1160" y2="1018" stroke="#d0d7de"/><text x="40" y="1042" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="1042" font-size="12" fill="#57606a" font-weight="normal" text-anchor="end">Spec: IN/uc-02-blocked-credit-audit.md</text></svg>
