2" font-size="38" fill="#2f3c9e" font-weight="bold" text-anchor="start">?</text><text x="110" y="203" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“Which supplier bills make us liable to pay the tax ourselves, and have we?”</text><rect x="40.0" y="251" width="361.3333333333333" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="251" width="5" height="210" rx="2" fill="#2f3c9e"/><circle cx="72.0" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72.0" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="319" r="3.5" fill="#2f3c9e"/><text x="78.0" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">s.9(3): notified services (GTA, legal,</text><text x="78.0" y="343" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">sponsorship…) taxed in the buyer&#x27;s hands</text><circle cx="66.0" cy="365" r="3.5" fill="#2f3c9e"/><text x="78.0" y="369" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">s.9(4): notified supplies from</text><text x="78.0" y="389" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">unregistered persons</text><circle cx="66.0" cy="411" r="3.5" fill="#2f3c9e"/><text x="78.0" y="415" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Missed RCM: tax + interest, and no credit</text><text x="78.0" y="435" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">until paid</text><rect x="419.3333333333333" y="251" width="361.3333333333333" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="419.3333333333333" y="251" width="5" height="210" rx="2" fill="#2f3c9e"/><circle cx="451.3333333333333" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="451.3333333333333" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="319" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Weekly sweep</text><circle cx="445.3333333333333" cy="345" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="349" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On request: current RCM exposure</text><circle cx="445.3333333333333" cy="371" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="375" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Standing audit, not period-bound</text><rect x="798.6666666666666" y="251" width="361.3333333333333" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="251" width="5" height="210" rx="2" fill="#2f3c9e"/><circle cx="830.6666666666666" cy="281" r="14" fill="#2f3c9e" opacity="0.12"/><text x="830.6666666666666" y="286" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="286" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="309" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Bill.list</text><rect x="905.1466666666666" y="309" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="914.1466666666666" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Party.get</text><rect x="989.6266666666667" y="309" width="85.2" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="998.6266666666667" y="325.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Party.list</text><text x="40" y="491" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="487" x2="1160" y2="487" stroke="#d0d7de"/><rect x="40.0" y="507" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="533" r="14" fill="#2f3c9e"/><text x="66.0" y="538" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="571" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Fetch bills</text><text x="54.0" y="593" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">All bills in the trigger window</text><path d="M397.3333333333333 568.0 L417.3333333333333 568.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 562.0 L421.3333333333333 568.0 L413.3333333333333 574.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="507" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="533" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="538" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="437.3333333333333" y="571" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Join vendor</text><text x="437.3333333333333" y="593" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">gst_treatment, GSTIN, name from Party</text><path d="M780.6666666666666 568.0 L800.6666666666666 568.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 562.0 L804.6666666666666 568.0 L796.6666666666666 574.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="507" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="533" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="538" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="820.6666666666666" y="571" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Classify supplier</text><text x="820.6666666666666" y="593" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">SAC first, then vendor type, against the RCM</text><text x="820.6666666666666" y="613" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">table</text><rect x="40.0" y="645" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="671" r="14" fill="#2f3c9e"/><text x="66.0" y="676" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="54.0" y="709" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">RCM expected?</text><text x="54.0" y="731" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">&#x27;always&#x27; rows, or conditional rows that</text><text x="54.0" y="751" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">apply</text><path d="M397.3333333333333 706.0 L417.3333333333333 706.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 700.0 L421.3333333333333 706.0 L413.3333333333333 712.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="645" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="671" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="676" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="437.3333333333333" y="709" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Cross-check flag</text><text x="437.3333333333333" y="731" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Compare with Bill.is_reverse_charge</text><path d="M780.6666666666666 706.0 L800.6666666666666 706.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 700.0 L804.6666666666666 706.0 L796.6666666666666 712.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="645" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="671" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="676" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="820.6666666666666" y="709" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Tax due</text><text x="820.6666666666666" y="731" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Rate × taxable value for undeclared rows</text><rect x="40" y="793" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="793" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="72" cy="823" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="828" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="828" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="852" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="861" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">rcm_undeclared_liability: RCM expected, flag off, no forward tax</text><rect x="62" y="878" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="887" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">rcm_flag_spurious: flag set where RCM can&#x27;t apply</text><rect x="609.0" y="793" width="551.0" height="170" rx="10" fill="#e8f5ec" stroke="none" stroke-width="1"/><text x="631.0" y="828" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 28 SEP 2026</text><text x="631.0" y="887" font-size="40" fill="#1a7f37" font-weight="bold" text-anchor="start">5 GTA bills</text><text x="631.0" y="913" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Chakan Transport Lines (SAC 996511) with RCM off, but they charge 18%</text><text x="631.0" y="933" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">forward GST (₹29,736), so no undeclared RCM.</text><rect x="40" y="981" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="1005" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Identifies the gap only; does not raise the self-invoice or pay the tax.</text><line x1="40" y1="1038" x2="1160" y2="1038" stroke="#d0d7de"/><text x="40" y="1062" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="1062" font-size="12" fill="#57606a" font-weight="normal" text-anchor="end">Spec: IN/uc-03-rcm-self-invoicing.md</text></svg>
