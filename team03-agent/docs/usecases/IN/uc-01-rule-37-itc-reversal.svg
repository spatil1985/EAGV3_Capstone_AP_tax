<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1098" viewBox="0 0 1200 1098" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">UC-01 — Rule 37: 180-day non-payment credit reversal</title><desc id="d">Which unpaid bills are about to cost me my input credit, and how much?</desc><rect width="1200" height="1098" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="122" fill="#2f3c9e"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">UC-01  ·  INDIA · GST</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Rule 37: 180-day non-payment credit reversal</text><rect x="930" y="22" width="230" height="78" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#1a7f37" font-weight="bold" text-anchor="middle" letter-spacing="1.5">BUILDABLE</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Buildable now · first breach due</text><text x="1045.0" y="86" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">5 Dec 2026</text><circle cx="948" cy="45" r="6" fill="#1a7f37"/><rect x="40" y="140" width="80.48" height="24" rx="12" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="80.24000000000001" y="156.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="middle">Input tax</text><rect x="128.48000000000002" y="140" width="134.24" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="195.60000000000002" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: all five</text><rect x="270.72" y="140" width="127.52000000000001" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="334.48" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: rule37</text><rect x="40" y="182" width="1120" height="63" rx="14" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="66" y="228" font-size="38" fill="#2f3c9e" font-weight="bold" text-anchor="start">?</text><text x="110" y="219" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“Which unpaid bills are about to cost me my input credit, and how much?”</text><rect x="40.0" y="267" width="361.3333333333333" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="267" width="5" height="210" rx="2" fill="#2f3c9e"/><circle cx="72.0" cy="297" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72.0" y="302" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="302" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="335" r="3.5" fill="#2f3c9e"/><text x="78.0" y="339" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">s.16(2) 2nd proviso: supplier unpaid after</text><text x="78.0" y="359" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">180 days → credit added back</text><circle cx="66.0" cy="381" r="3.5" fill="#2f3c9e"/><text x="78.0" y="385" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Rule 37: reverse with 18% p.a. interest</text><text x="78.0" y="405" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">under s.50(1)</text><circle cx="66.0" cy="427" r="3.5" fill="#2f3c9e"/><text x="78.0" y="431" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Credit can be re-availed once the supplier</text><text x="78.0" y="451" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">is paid</text><rect x="419.3333333333333" y="267" width="361.3333333333333" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="419.3333333333333" y="267" width="5" height="210" rx="2" fill="#2f3c9e"/><circle cx="451.3333333333333" cy="297" r="14" fill="#2f3c9e" opacity="0.12"/><text x="451.3333333333333" y="302" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="302" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="335" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="339" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Daily: the 180-day line moves with the</text><text x="457.3333333333333" y="359" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">calendar, not with a document</text><circle cx="445.3333333333333" cy="381" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="385" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On request: same live computation, never</text><text x="457.3333333333333" y="405" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">cached</text><circle cx="445.3333333333333" cy="427" r="3.5" fill="#2f3c9e"/><text x="457.3333333333333" y="431" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Point-in-time age against today</text><rect x="798.6666666666666" y="267" width="361.3333333333333" height="210" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="267" width="5" height="210" rx="2" fill="#2f3c9e"/><circle cx="830.6666666666666" cy="297" r="14" fill="#2f3c9e" opacity="0.12"/><text x="830.6666666666666" y="302" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="302" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="325" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="341.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Bill.list</text><rect x="905.1466666666666" y="325" width="78.48" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="914.1466666666666" y="341.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">Party.get</text><rect x="989.6266666666667" y="325" width="91.92" height="24" rx="6" fill="#eef0fb" stroke="none" stroke-width="1"/><text x="998.6266666666667" y="341.5" font-size="12" fill="#2f3c9e" font-weight="bold" text-anchor="start">tax_math.py</text><circle cx="824.6666666666666" cy="369" r="3.5" fill="#57606a"/><text x="836.6666666666666" y="373" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Tax source chosen per document: taxes[] if it</text><text x="836.6666666666666" y="391" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">reconciles to total_tax, else items[].</text><text x="40" y="507" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="503" x2="1160" y2="503" stroke="#d0d7de"/><rect x="40.0" y="523" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="549" r="14" fill="#2f3c9e"/><text x="66.0" y="554" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="587" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Fetch eligible bills</text><text x="54.0" y="609" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">itc_eligibility ≠ ineligible; page through</text><text x="54.0" y="629" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">up to 1,000</text><path d="M397.3333333333333 584.0 L417.3333333333333 584.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 578.0 L421.3333333333333 584.0 L413.3333333333333 590.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="523" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="549" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="554" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="437.3333333333333" y="587" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Drop paid bills</text><text x="437.3333333333333" y="609" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">balance_due = 0 means no exposure</text><path d="M780.6666666666666 584.0 L800.6666666666666 584.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 578.0 L804.6666666666666 584.0 L796.6666666666666 590.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="523" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="549" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="554" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="820.6666666666666" y="587" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Age each bill</text><text x="820.6666666666666" y="609" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">age_days = today − bill date</text><rect x="40.0" y="661" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="687" r="14" fill="#2f3c9e"/><text x="66.0" y="692" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="54.0" y="725" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Keep breaches</text><text x="54.0" y="747" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">age_days &gt; 180 (day 180 itself is compliant)</text><path d="M397.3333333333333 722.0 L417.3333333333333 722.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M413.3333333333333 716.0 L421.3333333333333 722.0 L413.3333333333333 728.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="423.3333333333333" y="661" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="449.3333333333333" cy="687" r="14" fill="#2f3c9e"/><text x="449.3333333333333" y="692" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="437.3333333333333" y="725" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Credit to reverse</text><text x="437.3333333333333" y="747" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">CGST + SGST + IGST + cess from the validated</text><text x="437.3333333333333" y="767" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">tax source</text><path d="M780.6666666666666 722.0 L800.6666666666666 722.0" stroke="#2f3c9e" stroke-width="2.5"/><path d="M796.6666666666666 716.0 L804.6666666666666 722.0 L796.6666666666666 728.0" fill="none" stroke="#2f3c9e" stroke-width="2.5"/><rect x="806.6666666666666" y="661" width="353.3333333333333" height="122" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="832.6666666666666" cy="687" r="14" fill="#2f3c9e"/><text x="832.6666666666666" y="692" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="820.6666666666666" y="725" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Add interest</text><text x="820.6666666666666" y="747" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">credit × 18% × (age − 180) ÷ 365; total via</text><text x="820.6666666666666" y="767" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">tax_math.py</text><rect x="40" y="809" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="809" width="5" height="170" rx="2" fill="#2f3c9e"/><circle cx="72" cy="839" r="14" fill="#2f3c9e" opacity="0.12"/><text x="72" y="844" font-size="14" fill="#2f3c9e" font-weight="bold" text-anchor="middle">!</text><text x="94" y="844" font-size="13" fill="#2f3c9e" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="868" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="877" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">itc_reversal · rule_37_180_day: one row per bill</text><rect x="62" y="894" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="903" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Defines the shared reversal row reused by UC-08, 15, 16, 17</text><rect x="62" y="920" width="8" height="8" rx="2" fill="#2f3c9e"/><text x="78" y="929" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Sorted by total exposure, largest first</text><rect x="609.0" y="809" width="551.0" height="170" rx="10" fill="#e8f5ec" stroke="none" stroke-width="1"/><text x="631.0" y="844" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 28 SEP 2026</text><text x="631.0" y="903" font-size="40" fill="#1a7f37" font-weight="bold" text-anchor="start">₹1,02,672</text><text x="631.0" y="929" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">0 breaches today: oldest bill is 113 days. BILL-2026-00001 crosses day</text><text x="631.0" y="949" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">180 on 5 Dec 2026 with ₹1,02,672 of credit to reverse.</text><rect x="40" y="997" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="1021" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Never posts to the ledger. Does not check whether the reversal was filed, and does not track re-availment.</text><line x1="40" y1="1054" x2="1160" y2="1054" stroke="#d0d7de"/><text x="40" y="1078" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Suryodaya Precision Works Pvt. Ltd.</text><text x="1160" y="1078" font-size="12" fill="#57606a" font-weight="normal" text-anchor="end">Spec: IN/uc-01-rule-37-itc-reversal.md</text></svg>
