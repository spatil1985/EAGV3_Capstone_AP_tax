<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">US-05 — Sales tax sourcing and rate correctness</title><desc id="d">Are we charging each customer the right state and local rate for where the sale happens?</desc><rect width="1200" height="920" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="106" fill="#0b6e69"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">US-05  ·  US · SALES &amp; USE TAX</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Sales tax sourcing and rate correctness</text><rect x="930" y="22" width="230" height="62" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#9a6700" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PARTIAL</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Partial · one live contradiction</text><circle cx="948" cy="45" r="6" fill="#9a6700"/><rect x="40" y="124" width="87.2" height="24" rx="12" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="83.6" y="140.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="middle">Output tax</text><rect x="135.2" y="124" width="134.24" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="202.32" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: all five</text><rect x="277.44" y="124" width="120.80000000000001" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="337.84000000000003" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: rates</text><rect x="406.24" y="124" width="93.92" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="453.2" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Twin: UC-18</text><rect x="40" y="166" width="1120" height="63" rx="14" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="66" y="212" font-size="38" fill="#0b6e69" font-weight="bold" text-anchor="start">?</text><text x="110" y="203" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“Are we charging each customer the right state and local rate for where the sale happens?”</text><rect x="40.0" y="251" width="361.3333333333333" height="190" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="251" width="5" height="190" rx="2" fill="#0b6e69"/><circle cx="72.0" cy="281" r="14" fill="#0b6e69" opacity="0.12"/><text x="72.0" y="286" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="286" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="319" r="3.5" fill="#0b6e69"/><text x="78.0" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Sourcing: origin vs destination by state</text><circle cx="66.0" cy="345" r="3.5" fill="#0b6e69"/><text x="78.0" y="349" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Ohio: destination for local rates on</text><text x="78.0" y="369" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">delivered goods</text><circle cx="66.0" cy="391" r="3.5" fill="#0b6e69"/><text x="78.0" y="395" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Wrong rate: under-collected tax is owed by</text><text x="78.0" y="415" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">the seller</text><rect x="419.3333333333333" y="251" width="361.3333333333333" height="190" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="419.3333333333333" y="251" width="5" height="190" rx="2" fill="#0b6e69"/><circle cx="451.3333333333333" cy="281" r="14" fill="#0b6e69" opacity="0.12"/><text x="451.3333333333333" y="286" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="286" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="319" r="3.5" fill="#0b6e69"/><text x="457.3333333333333" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On each new invoice</text><circle cx="445.3333333333333" cy="345" r="3.5" fill="#0b6e69"/><text x="457.3333333333333" y="349" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Monthly sweep before the return</text><rect x="798.6666666666666" y="251" width="361.3333333333333" height="190" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="251" width="5" height="190" rx="2" fill="#0b6e69"/><circle cx="830.6666666666666" cy="281" r="14" fill="#0b6e69" opacity="0.12"/><text x="830.6666666666666" y="286" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="286" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="309" width="98.64000000000001" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="325.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">Invoice.list</text><rect x="925.3066666666666" y="309" width="152.4" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="934.3066666666666" y="325.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">TaxJurisdiction.list</text><rect x="820.6666666666666" y="339" width="78.48" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="355.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">Party.get</text><text x="40" y="471" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="467" x2="1160" y2="467" stroke="#d0d7de"/><rect x="40.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="513" r="14" fill="#0b6e69"/><text x="66.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Arithmetic</text><text x="54.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">amount = taxable × rate</text><path d="M244.0 546.0 L264.0 546.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M260.0 540.0 L268.0 546.0 L260.0 552.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="270.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="296.0" cy="513" r="14" fill="#0b6e69"/><text x="296.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="284.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Rate drift</text><text x="284.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Row rate vs jurisdiction</text><path d="M474.0 546.0 L494.0 546.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M490.0 540.0 L498.0 546.0 L490.0 552.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="500.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="526.0" cy="513" r="14" fill="#0b6e69"/><text x="526.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="514.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">State sourcing</text><text x="514.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Tax state = customer</text><text x="514.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">state</text><path d="M704.0 546.0 L724.0 546.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M720.0 540.0 L728.0 546.0 L720.0 552.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="730.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="756.0" cy="513" r="14" fill="#0b6e69"/><text x="756.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="744.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Local sourcing</text><text x="744.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">County matches the</text><text x="744.0" y="591" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">destination</text><path d="M934.0 546.0 L954.0 546.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M950.0 540.0 L958.0 546.0 L950.0 552.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="960.0" y="487" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="986.0" cy="513" r="14" fill="#0b6e69"/><text x="986.0" y="518" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="974.0" y="551" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Missing local</text><text x="974.0" y="573" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">No county tax where due</text><rect x="40" y="631" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="631" width="5" height="170" rx="2" fill="#0b6e69"/><circle cx="72" cy="661" r="14" fill="#0b6e69" opacity="0.12"/><text x="72" y="666" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">!</text><text x="94" y="666" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="690" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="699" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">rate_drift</text><rect x="62" y="716" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="725" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">state_sourcing_mismatch</text><rect x="62" y="742" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="751" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">local_sourcing_mismatch</text><rect x="62" y="768" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="777" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">local_rate_unconfigured</text><rect x="609.0" y="631" width="551.0" height="170" rx="10" fill="#fff4d6" stroke="none" stroke-width="1"/><text x="631.0" y="666" font-size="13" fill="#9a6700" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 3 OCT 2026</text><text x="631.0" y="725" font-size="40" fill="#9a6700" font-weight="bold" text-anchor="start">$7,919.93</text><text x="631.0" y="751" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Stark County tax on 36 OH invoices to customers outside Stark County,</text><text x="631.0" y="771" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">while sourcing is destination.</text><rect x="40" y="819" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="843" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Limits: Arithmetic exact on every line; the issue is sourcing.</text><line x1="40" y1="876" x2="1160" y2="876" stroke="#d0d7de"/><text x="40" y="900" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">Team 03 · Seat 03 Payables &amp; Tax · Keystone Precision Works LLC</text><text x="1160" y="900" font-size="12" fill="#57606a" fo