<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="923" viewBox="0 0 1200 923" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">US-10 — Sales tax on credit memos and refund windows</title><desc id="d">For returns and price adjustments, did we refund the sales tax correctly, and are we still inside the state&#x27;s refund window?</desc><rect width="1200" height="923" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="122" fill="#0b6e69"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">US-10  ·  US · SALES &amp; USE TAX</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Sales tax on credit memos and refund windows</text><rect x="930" y="22" width="230" height="78" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#57606a" font-weight="bold" text-anchor="middle" letter-spacing="1.5">SPEC ONLY</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Spec only · no credit memos on</text><text x="1045.0" y="86" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">the tenant</text><circle cx="948" cy="45" r="6" fill="#57606a"/><rect x="40" y="140" width="87.2" height="24" rx="12" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="83.6" y="156.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="middle">Output tax</text><rect x="135.2" y="140" width="134.24" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="202.32" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: all five</text><rect x="277.44" y="140" width="208.16000000000003" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="381.52" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: credit-note-window</text><rect x="493.6" y="140" width="93.92" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="540.5600000000001" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Twin: UC-19</text><rect x="40" y="182" width="1120" height="92" rx="14" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="66" y="228" font-size="38" fill="#0b6e69" font-weight="bold" text-anchor="start">?</text><text x="110" y="219" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“For returns and price adjustments, did we refund the sales tax correctly, and are we still</text><text x="110" y="248" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">inside the state&#x27;s refund window?”</text><rect x="40.0" y="296" width="361.3333333333333" height="164" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="296" width="5" height="164" rx="2" fill="#0b6e69"/><circle cx="72.0" cy="326" r="14" fill="#0b6e69" opacity="0.12"/><text x="72.0" y="331" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="331" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="364" r="3.5" fill="#0b6e69"/><text x="78.0" y="368" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Refund windows are set by state (typically</text><text x="78.0" y="388" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">3–4 years)</text><circle cx="66.0" cy="410" r="3.5" fill="#0b6e69"/><text x="78.0" y="414" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Tax refunded to customer must be reclaimed</text><text x="78.0" y="434" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">from the state in time</text><rect x="419.3333333333333" y="296" width="361.3333333333333" height="164" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="419.3333333333333" y="296" width="5" height="164" rx="2" fill="#0b6e69"/><circle cx="451.3333333333333" cy="326" r="14" fill="#0b6e69" opacity="0.12"/><text x="451.3333333333333" y="331" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="331" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="364" r="3.5" fill="#0b6e69"/><text x="457.3333333333333" y="368" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On each credit memo against a taxed</text><text x="457.3333333333333" y="388" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">invoice</text><circle cx="445.3333333333333" cy="410" r="3.5" fill="#0b6e69"/><text x="457.3333333333333" y="414" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Monthly: memos nearing the window</text><rect x="798.6666666666666" y="296" width="361.3333333333333" height="164" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="296" width="5" height="164" rx="2" fill="#0b6e69"/><circle cx="830.6666666666666" cy="326" r="14" fill="#0b6e69" opacity="0.12"/><text x="830.6666666666666" y="331" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="331" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="354" width="118.80000000000001" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="370.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">CreditNote.list</text><rect x="945.4666666666667" y="354" width="91.92" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="954.4666666666667" y="370.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">Invoice.get</text><rect x="820.6666666666666" y="384" width="125.52000000000001" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="400.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">liability report</text><text x="40" y="490" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="486" x2="1160" y2="486" stroke="#d0d7de"/><rect x="40.0" y="506" width="257.5" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="532" r="14" fill="#0b6e69"/><text x="66.0" y="537" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="570" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Expected tax</text><text x="54.0" y="592" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Credited net × original rate</text><path d="M301.5 557.0 L321.5 557.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M317.5 551.0 L325.5 557.0 L317.5 563.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="327.5" y="506" width="257.5" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="353.5" cy="532" r="14" fill="#0b6e69"/><text x="353.5" y="537" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="341.5" y="570" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Over-credit</text><text x="341.5" y="592" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Memo larger than invoice</text><path d="M589.0 557.0 L609.0 557.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M605.0 551.0 L613.0 557.0 L605.0 563.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="615.0" y="506" width="257.5" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="641.0" cy="532" r="14" fill="#0b6e69"/><text x="641.0" y="537" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="629.0" y="570" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Window closing</text><text x="629.0" y="592" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Tax not yet recovered</text><path d="M876.5 557.0 L896.5 557.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M892.5 551.0 L900.5 557.0 L892.5 563.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="902.5" y="506" width="257.5" height="102" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="928.5" cy="532" r="14" fill="#0b6e69"/><text x="928.5" y="537" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="916.5" y="570" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">Reconcile</text><text x="916.5" y="592" font-size="14" fill="#57606a" font-weight="normal" text-anchor="start">Σ credited tax vs report</text><rect x="40" y="634" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="634" width="5" height="170" rx="2" fill="#0b6e69"/><circle cx="72" cy="664" r="14" fill="#0b6e69" opacity="0.12"/><text x="72" y="669" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">!</text><text x="94" y="669" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="693" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="702" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">credit_tax_wrong</text><rect x="62" y="719" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="728" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">credit_exceeds_invoice</text><rect x="62" y="745" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="754" font-size="13" fill="#1f2328" font-weight="normal" text-an