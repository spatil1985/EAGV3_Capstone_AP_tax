a" font-weight="normal" text-anchor="start">Manufacturing, resale,</text><text x="284.0" y="620" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">nonprofit, Rx</text><path d="M474.0 575.0 L494.0 575.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M490.0 569.0 L498.0 575.0 L490.0 581.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="500.0" y="516" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="526.0" cy="542" r="14" fill="#0b6e69"/><text x="526.0" y="547" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="514.0" y="580" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Overpaid</text><text x="514.0" y="602" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Taxed and exempt</text><path d="M704.0 575.0 L724.0 575.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M720.0 569.0 L728.0 575.0 L720.0 581.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="730.0" y="516" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="756.0" cy="542" r="14" fill="#0b6e69"/><text x="756.0" y="547" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="744.0" y="580" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">No certificate</text><text x="744.0" y="602" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">None issued to vendor</text><path d="M934.0 575.0 L954.0 575.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M950.0 569.0 L958.0 575.0 L950.0 581.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="960.0" y="516" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="986.0" cy="542" r="14" fill="#0b6e69"/><text x="986.0" y="547" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="974.0" y="580" font-size="14" fill="#1f23