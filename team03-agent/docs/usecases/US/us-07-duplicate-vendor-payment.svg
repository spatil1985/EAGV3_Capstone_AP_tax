<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="926" viewBox="0 0 1200 926" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">US-07 — Duplicate vendor payment</title><desc id="d">Is any vendor being paid twice?</desc><rect width="1200" height="926" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="122" fill="#0b6e69"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">US-07  ·  US · SALES &amp; USE TAX</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Duplicate vendor payment</text><rect x="930" y="22" width="230" height="78" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#1a7f37" font-weight="bold" text-anchor="middle" letter-spacing="1.5">BUILDABLE</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Buildable · regime-agnostic · 0</text><text x="1045.0" y="86" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">findings</text><circle cx="948" cy="45" r="6" fill="#1a7f37"/><rect x="40" y="140" width="127.52000000000001" height="24" rx="12" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="103.76" y="156.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="middle">Payables control</text><rect x="175.52" y="140" width="134.24" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="242.64000000000001" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: all five</text><rect x="317.76" y="140" width="154.4" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="394.96" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: duplicates</text><rect x="480.15999999999997" y="140" width="93.92" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="527.12" y="156.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Twin: UC-05</text><rect x="40" y="182" width="1120" height="63" rx="14" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="66" y="228" font-size="38" fill="#0b6e69" font-weight="bold" text-anchor="start">?</text><text x="110" y="219" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“Is any vendor being paid twice?”</text><rect x="40.0" y="267" width="361.3333333333333" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="267" width="5" height="180" rx="2" fill="#0b6e69"/><circle cx="72.0" cy="297" r="14" fill="#0b6e69" opacity="0.12"/><text x="72.0" y="302" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="302" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="335" r="3.5" fill="#0b6e69"/><text x="78.0" y="339" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Financial control: SOX §404 for issuers</text><circle cx="66.0" cy="361" r="3.5" fill="#0b6e69"/><text x="78.0" y="365" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">No input credit to double-claim: a</text><text x="78.0" y="385" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">duplicate costs cash plus any use tax</text><rect x="419.3333333333333" y="267" width="361.3333333333333" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="419.3333333333333" y="267" width="5" height="180" rx="2" fill="#0b6e69"/><circle cx="451.3333333333333" cy="297" r="14" fill="#0b6e69" opacity="0.12"/><text x="451.3333333333333" y="302" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="302" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</text><circle cx="445.3333333333333" cy="335" r="3.5" fill="#0b6e69"/><text x="457.3333333333333" y="339" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">On every new bill, before approval</text><circle cx="445.3333333333333" cy="361" r="3.5" fill="#0b6e69"/><text x="457.3333333333333" y="365" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Daily sweep over open bills</text><circle cx="445.3333333333333" cy="387" r="3.5" fill="#0b6e69"/><text x="457.3333333333333" y="391" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Algorithm as UC-05</text><rect x="798.6666666666666" y="267" width="361.3333333333333" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="798.6666666666666" y="267" width="5" height="180" rx="2" fill="#0b6e69"/><circle cx="830.6666666666666" cy="297" r="14" fill="#0b6e69" opacity="0.12"/><text x="830.6666666666666" y="302" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">⇩</text><text x="852.6666666666666" y="302" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">DATA IN</text><rect x="820.6666666666666" y="325" width="78.48" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="341.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">Bill.list</text><rect x="905.1466666666666" y="325" width="85.2" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="914.1466666666666" y="341.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">bill_match</text><rect x="996.3466666666667" y="325" width="138.96" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="1005.3466666666667" y="341.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">RecurringBill.list</text><rect x="820.6666666666666" y="355" width="125.52000000000001" height="24" rx="6" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="829.6666666666666" y="371.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="start">PaymentMade.list</text><circle cx="824.6666666666666" cy="399" r="3.5" fill="#57606a"/><text x="836.6666666666666" y="403" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">bill_number empty on 101/101 bills, so the</text><text x="836.6666666666666" y="421" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">exact tier can&#x27;t run.</text><text x="40" y="477" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">HOW THE AGENT ANSWERS IT</text><line x1="270" y1="473" x2="1160" y2="473" stroke="#d0d7de"/><rect x="40.0" y="493" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="66.0" cy="519" r="14" fill="#0b6e69"/><text x="66.0" y="524" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="54.0" y="557" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Tier 2: over-billed</text><text x="54.0" y="579" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">bill_match on PO bills</text><path d="M244.0 552.0 L264.0 552.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M260.0 546.0 L268.0 552.0 L260.0 558.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="270.0" y="493" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="296.0" cy="519" r="14" fill="#0b6e69"/><text x="296.0" y="524" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="284.0" y="557" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Tier 3: amount</text><text x="284.0" y="579" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Same vendor, same total,</text><text x="284.0" y="597" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">≤ 3 days</text><path d="M474.0 552.0 L494.0 552.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M490.0 546.0 L498.0 552.0 L490.0 558.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="500.0" y="493" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="526.0" cy="519" r="14" fill="#0b6e69"/><text x="526.0" y="524" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="514.0" y="557" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Recurring gate</text><text x="514.0" y="579" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Same template → drop</text><path d="M704.0 552.0 L724.0 552.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M720.0 546.0 L728.0 552.0 L720.0 558.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="730.0" y="493" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="756.0" cy="519" r="14" fill="#0b6e69"/><text x="756.0" y="524" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="744.0" y="557" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Standing orders</text><text x="744.0" y="579" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Distinct PO + ≥ 14 days →</text><text x="744.0" y="597" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">drop</text><path d="M934.0 552.0 L954.0 552.0" stroke="#0b6e69" stroke-width="2.5"/><path d="M950.0 546.0 L958.0 552.0 L950.0 558.0" fill="none" stroke="#0b6e69" stroke-width="2.5"/><rect x="960.0" y="493" width="200.0" height="118" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><circle cx="986.0" cy="519" r="14" fill="#0b6e69"/><text x="986.0" y="524" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="974.0" y="557" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">Paid check</text><text x="974.0" y="579" font-size="13" fill="#57606a" font-weight="normal" text-anchor="start">Recovery vs hold</text><rect x="40" y="637" width="551.0" height="170" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40" y="637" width="5" height="170" rx="2" fill="#0b6e69"/><circle cx="72" cy="667" r="14" fill="#0b6e69" opacity="0.12"/><text x="72" y="672" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">!</text><text x="94" y="672" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">FINDINGS IT EMITS</text><rect x="62" y="696" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="705" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">duplicate_payment · suspicious_strong / suspicious_weak</text><rect x="62" y="722" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="731" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">over_billed (Tier 2)</text><rect x="62" y="748" width="8" height="8" rx="2" fill="#0b6e69"/><text x="78" y="757" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="start">Standing orders suppressed</text><rect x="609.0" y="637" width="551.0" height="170" rx="10" fill="#e8f5ec" stroke="none" stroke-width="1"/><text x="631.0" y="672" font-size="13" fill="#1a7f37" font-weight="bold" text-anchor="start" letter-spacing="1">LIVE EVIDENCE · 3 OCT 2026</text><text x="631.0" y="731" font-size="40" fill="#1a7f37" font-weight="bold" text-anchor="start">0 pairs</text><text x="631.0" y="757" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">15 groups of identical bills are fortnightly standing orders with</text><text x="631.0" y="777" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">distinct POs. Runaway recurring bills are now void/draft.</text><rect x="40" y="825" width="1120" height="39" rx="8" fill="#f6f8fa" stroke="none" stroke-width="1"/><text x="60" y="849" font-size="13" 