<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">US-19 — Bank-to-payables reconciliation</title><desc id="d">Does every vendor payment in the bank match a payment in our books, and the other way round?</desc><rect width="1200" height="910" fill="#fbfcfd"/><rect x="0" y="0" width="1200" height="106" fill="#0b6e69"/><text x="40" y="38" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" letter-spacing="1.5">US-19  ·  US · SALES &amp; USE TAX</text><text x="40" y="74" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">Bank-to-payables reconciliation</text><rect x="930" y="22" width="230" height="62" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="1045.0" y="50" font-size="15" fill="#1a7f37" font-weight="bold" text-anchor="middle" letter-spacing="1.5">BUILDABLE</text><text x="1045.0" y="70" font-size="12" fill="#57606a" font-weight="normal" text-anchor="middle">Buildable · live findings</text><circle cx="948" cy="45" r="6" fill="#1a7f37"/><rect x="40" y="124" width="127.52000000000001" height="24" rx="12" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="103.76" y="140.5" font-size="12" fill="#0b6e69" font-weight="bold" text-anchor="middle">Payables control</text><rect x="175.52" y="124" width="134.24" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="242.64000000000001" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Domains: all five</text><rect x="317.76" y="124" width="154.4" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="394.96" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Playbook: bank-recon</text><rect x="480.15999999999997" y="124" width="93.92" height="24" rx="12" fill="#f0f2f4" stroke="none" stroke-width="1"/><text x="527.12" y="140.5" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle">Twin: UC-43</text><rect x="40" y="166" width="1120" height="63" rx="14" fill="#e7f4f3" stroke="none" stroke-width="1"/><text x="66" y="212" font-size="38" fill="#0b6e69" font-weight="bold" text-anchor="start">?</text><text x="110" y="203" font-size="21" fill="#1f2328" font-weight="normal" text-anchor="start" font-style="italic">“Does every vendor payment in the bank match a payment in our books, and the other way round?”</text><rect x="40.0" y="251" width="361.3333333333333" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="251" width="5" height="180" rx="2" fill="#0b6e69"/><circle cx="72.0" cy="281" r="14" fill="#0b6e69" opacity="0.12"/><text x="72.0" y="286" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">§</text><text x="94.0" y="286" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">BASIS</text><circle cx="66.0" cy="319" r="3.5" fill="#0b6e69"/><text x="78.0" y="323" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Control, not statute</text><circle cx="66.0" cy="345" r="3.5" fill="#0b6e69"/><text x="78.0" y="349" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">Unmatched payments hide errors, fraud and</text><text x="78.0" y="369" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start">escheat items</text><rect x="419.3333333333333" y="251" width="361.3333333333333" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/><rect x="419.3333333333333" y="251" width="5" height="180" rx="2" fill="#0b6e69"/><circle cx="451.3333333333333" cy="281" r="14" fill="#0b6e69" opacity="0.12"/><text x="451.3333333333333" y="286" font-size="14" fill="#0b6e69" font-weight="bold" text-anchor="middle">⏱</text><text x="473.3333333333333" y="286" font-size="13" fill="#0b6e69" font-weight="bold" text-anchor="start" letter-spacing="1">TRIGGER</tex