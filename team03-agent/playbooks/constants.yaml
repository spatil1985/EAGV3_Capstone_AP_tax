# --- UC-10 job work (s.143 CGST Act) -------------------------------------------------
job_work_return_days_inputs:
  value: 365
  unit: days for inputs sent to a job worker to come back before the send is a deemed supply
  source: s.143(1)(a) and s.143(3) CGST Act 2017
  verified: null
job_work_return_days_capital_goods:
  value: 1095
  unit: days for capital goods (moulds, dies, jigs, fixtures, tools are exempt from the limit)
  source: s.143(1)(a) and s.143(3) CGST Act 2017
  verified: null
job_work_warning_days:
  value: 60
  unit: days before the deadline a challan is listed as due soon
  source: team choice (UC-10 §5 step 5)
  verified: null

# --- UC-13 194Q (s.206C(1H) understood omitted from 1 April 2025 — confirm) ------------
tds_194q_threshold_inr:
  value: 5000000
  unit: INR, FY-cumulative goods purchases from one seller above which 194Q applies
  source: s.194Q(1) Income-tax Act 1961
  verified: null
tds_194q_rate_pct:
  value: 0.1
  unit: percent of the purchase value above the threshold
  source: s.194Q(1) Income-tax Act 1961
  verified: null
tds_194q_buyer_turnover_inr:
  value: 100000000
  unit: INR, buyer's preceding-FY turnover above which it must deduct 194Q
  source: s.194Q(3)(a) Income-tax Act 1961
  verified: null
tds_194q_approaching_pct:
  value: 80
  unit: percent of the threshold at which a vendor is listed as approaching
  source: team choice (UC-13 §5 step 5)
  verified: null

# --- UC-14 clinic room rent ----------------------------------------------------------
clinic_room_rent_threshold_inr:
  value: 5000
  unit: INR per day per patient; non-ICU room rent above this is taxable
  source: Notification 4/2022-CT(R), amending 12/2017-CT(R) entry 46 (from 18 July 2022)
  verified: null
clinic_room_rent_rate_pct:
  value: 5
  unit: percent GST on taxable room rent, without ITC
  source: Notification 3/2022-CT(R)
  verified: null

