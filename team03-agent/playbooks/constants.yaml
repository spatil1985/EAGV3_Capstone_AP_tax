  - {value: 6.50, effective_from: 2025-02-07, effective_to: 2025-04-08, source: "RBI MPC 7 Feb 2025"}
  - {value: 6.25, effective_from: 2025-04-09, effective_to: 2025-06-05, source: "RBI MPC 9 Apr 2025"}
  - {value: 5.75, effective_from: 2025-06-06, effective_to: 2025-12-04, source: "RBI MPC 6 Jun 2025"}
  - {value: 5.50, effective_from: 2025-12-05, source: "RBI MPC 5 Dec 2025 (confirm)", review_by: 2026-12-31}
