# Statutory constants — rules, not data (harness_plan.md §5, spec.md §7).
# Shared contract (assignment.md §7). Playbooks read these via ctx.constant(name) and
# must never hardcode them, so a changed notification is a one-line edit here.
#
# Each entry: value · unit · source (statute / notification) · verified (date a human
# last checked the source; null = not yet checked).
#
# Seeded with UC-12's constants only. Add the rest (180 d, 45 d, ₹50 lakh, ₹5,000/day,
# 1 yr / 3 yr, 30 Nov, 18% p.a.) as their playbooks land.

eway_bill_threshold_inr:
  value: 50000
  unit: INR, consignment value including tax
  source: Rule 138(1), CGST Rules 2017
  verified: null

eway_bill_km_per_day:
  value: 200
  unit: km of distance per day of validity, normal cargo
  source: Rule 138(10), CGST Rules 2017
  verified: null

eway_bill_km_per_day_odc:
  value: 20
  unit: km of distance per day of validity, over-dimensional cargo
  source: Rule 138(10), CGST Rules 2017
  verified: null

# --- UC-01 Rule 37 ----------------------------------------------------------------
itc_payment_window_days:
  value: 180
  unit: days from invoice date to pay the supplier before ITC must be reversed
  source: s.16(2) second proviso CGST Act 2017; Rule 37 CGST Rules 2017
  verified: null

gst_interest_rate_pct:
  value: 18
  unit: percent per annum, simple interest on reversed ITC / late tax
  source: s.50(1) CGST Act 2017; Notification 13/2017-CT
  verified: null

itc_reversal_warning_days:
  value: 30
  unit: days before day 180 a bill is listed as "about to cross" (context, not a finding)
  source: team choice (UC-01 §10 near-miss window)
  verified: null

# --- UC-03 / UC-21 reverse charge ---------------------------------------------------
rcm_rate_gta_pct:
  value: 5
  unit: percent GST payable by the recipient on GTA services under reverse charge (no ITC to the GTA)
  source: Notification 13/2017-CT(R) entry 1 read with 11/2017-CT(R) item 9(iii)
  verified: null

rcm_rate_services_pct:
  value: 18
  unit: percent GST payable under reverse charge on legal, sponsorship and director services
  source: Notification 13/2017-CT(R) entries 2, 4, 6; 11/2017-CT(R) standard rate
  verified: null

# --- UC-04 / UC-42 MSME --------------------------------------------------------------
msme_payment_days:
  value: 45
  unit: maximum days from acceptance to pay a micro or small enterprise (agreed period can't exceed it)
  source: s.15 MSMED Act 2006; s.43B(h) Income-tax Act 1961 (renumbered under the 2025 Act — confirm)
  verified: null

msme_interest_multiple:
  value: 3
  unit: times the RBI bank rate, compounded monthly, on late payment to an MSE
  source: s.16 MSMED Act 2006
  verified: null

